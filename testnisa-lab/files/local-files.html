<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'self'">

<body><main class="container narrow">
<header class="hero"><p class="eyebrow">EXP-009 / LOCAL FILES</p><h1>本地 JSON 文件与下载</h1>
<p class="lead">验证本地文件选择、UTF-8 解码、JSON 解析、大小限制和安全下载。</p>
<div class="notice"><strong>安全边界：</strong>文件只在当前浏览器读取，不上传网络、不执行文件内容、不写入 IndexedDB。仅接受 .json 文件，最大 2 MiB。请勿使用真实账户或私人投资数据。</div></header>
<section class="panel"><h2>读取本地 JSON</h2><div class="field"><label for="json-file">选择 JSON 文件（最大 2 MiB）</label><input id="json-file" type="file" accept=".json,application/json"></div>
<div class="actions"><button class="button primary" id="read-json" type="button" disabled>读取并校验</button></div>
<div id="read-status" class="status" role="status" aria-live="polite">尚未选择文件。</div><pre id="read-preview">文件校验结果将在这里显示。</pre></section>
<section class="panel"><h2>下载 JSON 示例</h2><p class="small muted">生成 UTF-8 JSON 文件，自动规范化文件名并通过 Blob URL 下载。</p>
<div class="actions"><button class="button" id="download-sample" type="button">下载示例 JSON</button></div>
<div id="download-status" class="status" role="status" aria-live="polite">等待下载。</div></section>
<footer class="footer"><a href="../index.html">返回实验室</a> · <a href="../storage/backup.html">EXP-006 备份恢复</a></footer>
</main></body></html>
