name: Nightly Playwright E2E and Stability

on:
  # 02:00 Japan Standard Time (UTC+9) = 17:00 UTC on the previous day.
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      stability_minutes:
        description: 'Stability test duration in minutes'
        required: false
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: true
      STABILITY_DURATION_MINUTES: ${{ (github.event_name == 'workflow_dispatch' && inputs.stability_minutes != '' && inputs.stability_minutes) || (github.event_name == 'schedule' && '10') || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Playwright
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused company navigation regression
        run: npx playwright test tests/e2e/company-navigation.spec.js

      - name: Run browser regression and stability tests
        run: npm run test:e2e

      - name: Add stability summary to workflow report
        if: always()
        run: |
          if [ -f test-results/nightly-stability-summary.json ]; then
            echo '## Nightly browser stability summary' >> "$GITHUB_STEP_SUMMARY"
            cat test-results/nightly-stability-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-playwright-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
