name: Validate JavaScript and V10.14 four-module boundaries

on:
  push:
    branches: [main, feat/v10.27-move-plan-to-results-future]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check i18n.js
          node --check logger.js
          node --check runtime-logs.js
          node --check health-check.js
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>\\s*([\\s\\S]*?)<\\/script>/);if(!m)throw new Error('Inline application script not found');fs.writeFileSync('/tmp/planner-inline.js',m[1]);"
          node --check /tmp/planner-inline.js
      - name: Verify V10.14 four-module isolation contract
        run: node scripts/validate-v10.14.mjs
      - name: Test legacy Plan category migration and data preservation
        run: node scripts/test-plan-migration.mjs
      - name: Verify V10.25 sync overwrite protection and V10.28 pagination
        run: |
          node scripts/validate-v10.25.mjs
          node scripts/validate-v10.26.mjs
          node scripts/validate-v10.27.mjs
