name: Validate JavaScript, Memo migration, and Module Star Statistics

# Automatic push and pull-request validation disabled to conserve Actions minutes.
# Keep manual execution available when validation is explicitly requested.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check i18n.js
          node --check logger.js
          node --check runtime-logs.js
          node --check health-check.js
          node --check language-workspace.js
          node --check company-website.js
          node --check company-business.js
          node --check company-task-date-filter.js
          node --check company-overview-metrics.js
          node --check company-todo-center.js
          node --check company-project-customer-overview.js
          node --check company-business-trends.js
          node --check company-decision-center.js
          node --check company-contribution-analysis.js
          node --check company-customer-health.js
          node --check company-project-delivery-analysis.js
          node --check scripts/validate-v10.66.mjs
          node --check scripts/validate-v10.68.mjs
          node --check scripts/validate-v10.65.mjs
          node --check scripts/validate-v10.64.mjs
          node --check scripts/validate-v10.63.mjs
          node --check stock-dashboard.js
          node --check diary.js
          node --check role-control.js
          node --check entry-flow.js
          node --check learning-meetings.js
          node --check company-records-rules.js
          node --check company-records-workspace.js
          node --check company-record-loader.js
          node --check scripts/validate-v10.60.mjs
          node --check scripts/validate-v10.61.mjs
          node --check scripts/validate-v10.62.mjs
          node --check scripts/validate-v10.59.mjs
          node --check scripts/validate-v10.58.mjs
          node --check scripts/validate-v10.56.mjs
          node --check scripts/validate-v10.54.mjs
          node --check scripts/validate-v10.53.mjs
          node --check scripts/validate-v10.52.mjs
          node --check scripts/validate-v10.51.mjs
          node --check tests/e2e/company-navigation.spec.js
          node --check tests/e2e/fixtures.js
          node --check tests/e2e/plan-user-journey.spec.js
          node --check tests/e2e/module-workspaces-smoke.spec.js
          node --check tests/e2e/learning-meetings.spec.js
          node --check tests/e2e/local-storage-fail-closed.spec.js
          node --check tests/e2e/repository-management-navigation.spec.js
          node --check tests/e2e/repository-management-bulk-clear.spec.js
          node --check scripts/validate-v10.70.mjs
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>\\s*([\\s\\S]*?)<\\/script>/);if(!m)throw new Error('Inline application script not found');fs.writeFileSync('/tmp/planner-inline.js',m[1]);"
          node --check /tmp/planner-inline.js
      - name: Verify V10.14 four-module isolation contract
        run: node scripts/validate-v10.14.mjs
      - name: Test legacy Plan category migration and data preservation
        run: node scripts/test-plan-migration.mjs
      - name: Verify sync protection, pagination, and Memo migration
        run: |
          node scripts/validate-v10.25.mjs
          node scripts/validate-v10.26.mjs
          node scripts/validate-v10.27.mjs
          node scripts/validate-v10.29.mjs
          node scripts/validate-v10.33.mjs
          node scripts/validate-v10.34.mjs
          node scripts/validate-v10.35.mjs
          node scripts/validate-v10.36.mjs
          node scripts/validate-v10.37.mjs
          node scripts/validate-v10.38.mjs
          node scripts/validate-v10.50.mjs
          node scripts/validate-v10.51.mjs
          node scripts/validate-v10.52.mjs
          node scripts/validate-v10.53.mjs
          node scripts/validate-v10.54.mjs
          node scripts/validate-v10.56.mjs
          node scripts/validate-v10.60.mjs
          node scripts/validate-v10.61.mjs
          node scripts/validate-v10.62.mjs
          node scripts/validate-v10.63.mjs
          node scripts/validate-v10.64.mjs
          node scripts/validate-v10.65.mjs
          node scripts/validate-v10.66.mjs
          node scripts/validate-v10.68.mjs
          node scripts/validate-v10.70.mjs
          node scripts/validate-v10.59.mjs
          node scripts/validate-v10.58.mjs
          node tests/test-one-star-memo-migration.mjs

  repository-navigation-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test repository navigation and authenticated plan user journey
        run: npx playwright test tests/e2e/repository-management-*.spec.js tests/e2e/entry-flow.spec.js tests/e2e/learning-meetings.spec.js tests/e2e/plan-user-journey.spec.js tests/e2e/module-workspaces-smoke.spec.js tests/e2e/local-storage-fail-closed.spec.js
